<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Calorie Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, a quiet ledger of meals under a single loud number (kcal left); game mechanics live in chunky, pressable controls. */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --surface-2:#F4F6F2; --ink:#0F1F1A; --muted:#5E6D66; --line:#DCE2DB;
  --ember:#E4511B; --ember-soft:#FCE6DC; --primary:#0F3D2E; --primary-edge:#082519; --on-primary:#FFFFFF;
  --gold:#A87A1C; --gold-soft:#F6ECD3; --good:#1B7F56; --good-soft:#DDF1E7; --bad:#B93A22; --ice:#2F7FA8; --ice-soft:#DCEEF6;
  --m-p:#1F7A5A; --m-c:#C48A1C; --m-f:#4A6FA5;
  --shadow:0 1px 0 rgba(15,31,26,.04),0 8px 24px -12px rgba(15,31,26,.18);
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:18px; --r-sm:12px;
  --hero:#0F3D2E; --hero-ink:#F3F8F4; --hero-mute:rgba(243,248,244,.7); --hero-line:rgba(243,248,244,.16); --hero-fill:#FF8A57; --hero-good:#7FE3B4; --hero-bad:#FFB4A4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1310; --surface:#121D19; --surface-2:#182621; --ink:#EAF0EC; --muted:#93A39B; --line:#25352F;
    --ember:#FF6B36; --ember-soft:#3A1E13; --primary:#D5F0E2; --primary-edge:#8DBBA5; --on-primary:#0A1310;
    --gold:#E2B552; --gold-soft:#33290F; --good:#4CC38F; --good-soft:#12302A; --bad:#F0765E; --ice:#6FBCE2; --ice-soft:#12303E;
    --m-p:#4CC38F; --m-c:#E2B552; --m-f:#86A8DC;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); --hero:#123A2D; --hero-line:rgba(243,248,244,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1310; --surface:#121D19; --surface-2:#182621; --ink:#EAF0EC; --muted:#93A39B; --line:#25352F;
  --ember:#FF6B36; --ember-soft:#3A1E13; --primary:#D5F0E2; --primary-edge:#8DBBA5; --on-primary:#0A1310;
  --gold:#E2B552; --gold-soft:#33290F; --good:#4CC38F; --good-soft:#12302A; --bad:#F0765E; --ice:#6FBCE2; --ice-soft:#12303E;
  --m-p:#4CC38F; --m-c:#E2B552; --m-f:#86A8DC;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); --hero:#123A2D; --hero-line:rgba(243,248,244,.14);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
svg.ic.fill{fill:currentColor;stroke:none}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}
.tn{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:6px}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:560px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* Top bar */
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;flex:none}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.brand svg{color:var(--ember)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip.flame svg{color:var(--ember)} .chip.flame.off svg{color:var(--muted)} .chip.flame.off{color:var(--muted)}
.chip.gem svg{color:var(--ice)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.sync.saving{background:var(--gold);animation:pulse 1s infinite}
.sync.err{background:var(--bad)} .sync.local{background:var(--muted)}
@keyframes pulse{50%{opacity:.35}}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* Bottom nav */
nav.tabs{position:relative;z-index:6;flex:none;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 14px}
nav.tabs button.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--ink)}
nav.tabs button.tab[aria-current="page"] svg{color:var(--ember)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--ember);color:#fff;display:grid;place-items:center;margin:-22px auto 0;border-bottom:4px solid #A93710;box-shadow:0 10px 20px -10px var(--ember)}
.fab svg{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{box-shadow:none}
.card h2,.sec-h{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;text-wrap:balance}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--primary);color:var(--on-primary);border-bottom:4px solid var(--primary-edge);width:100%;transition:transform .06s}
.btn:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.btn.ember{background:var(--ember);color:#fff;border-bottom-color:#A93710}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:4px solid var(--line)}
.btn.sm{height:38px;font-size:14px;padding:0 14px;width:auto;border-radius:12px;border-bottom-width:3px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.solid{background:var(--surface-2);color:var(--ink)}
.link{color:var(--ember);font-weight:700;font-size:14px}

/* Date nav + week path */
.datenav{display:flex;align-items:center;justify-content:space-between}
.datenav .d{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.wk .node{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--line);border-bottom-width:4px}
.wk .node svg{width:18px;height:18px}
.wk.done .node{background:var(--ember);border-color:#A93710;color:#fff}
.wk.frozen .node{background:var(--ice-soft);border-color:var(--ice);color:var(--ice)}
.wk.missed .node{color:var(--muted);border-style:dashed;border-bottom-width:2px}
.wk.today .node{border-color:var(--ember);color:var(--ember)}
.wk.sel{color:var(--ink)} .wk.sel .node{outline:2px solid var(--ink);outline-offset:2px}
.wk.future{opacity:.5}

/* Hero */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2);fill:none} .ring .zone{stroke:var(--good-soft);fill:none} .ring .val{stroke:var(--ember);fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring.in .val{stroke:var(--good)} .ring.over .val{stroke:var(--bad)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid .num{font-size:40px;line-height:1}
.ring .mid span{font-size:12px;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;row-gap:5px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--ember-soft);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.ice{background:var(--ice-soft);color:var(--ice)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro .lbl{font-size:12px;font-weight:700;margin-bottom:5px}
.macro .val{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600} .macro .val b{color:var(--ink);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .4s}
.bar.p i{background:var(--m-p)} .bar.c i{background:var(--m-c)} .bar.f i{background:var(--m-f)} .bar.ember i{background:var(--ember)} .bar.gold i{background:var(--gold)} .bar.ice i{background:var(--ice)} .bar.good i{background:var(--good)}
.bar.lg{height:12px}

/* Quests */
.quest{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.quest+.quest{border-top:1px solid var(--line)}
.quest .qi{width:34px;height:34px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.quest.done .qi{background:var(--good-soft);color:var(--good)}
.quest .qt{font-weight:600;font-size:14px;margin-bottom:5px}
.quest .qn{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* Meals */
.meal-h{display:flex;align-items:center;gap:8px}
.meal-h h2{flex:1}
.meal-h .k{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--muted)}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.entry:first-of-type{margin-top:10px}
.entry .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .k{font-weight:700;font-variant-numeric:tabular-nums}
.entry .s{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.entry .s span.ell{min-width:0}
.empty{color:var(--muted);font-size:13px;padding-top:8px}
.addline{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--ember);font-weight:700;font-size:14px;width:100%}
.src{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);flex:none}
.src.v{background:var(--good-soft);color:var(--good)} .src.l{background:var(--ice-soft);color:var(--ice)} .src.e{background:var(--gold-soft);color:var(--gold)} .src.m{background:var(--ember-soft);color:var(--ember)}

.water-row{display:flex;align-items:center;gap:12px}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner svg{color:var(--gold);margin-top:1px}

/* Sheets */
.scrim{position:absolute;inset:0;background:rgba(8,16,13,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet.full{height:94%}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px;flex:none}
.sheet-h h3{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.sheet-f{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--bg);flex:none;display:flex;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}

/* Forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.inp,select.inp,textarea.inp{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;font-weight:600;color:var(--ink);width:100%;min-width:0}
textarea.inp{height:auto;min-height:110px;padding:12px;resize:none;line-height:1.4;font-weight:500}
.inp:focus{outline:none;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;height:50px}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:16px;font-weight:600;min-width:0;height:100%}
.searchbar svg{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--line);font-size:12px;font-weight:700;text-align:center}
.tile svg{width:24px;height:24px;color:var(--ember)}
.tile:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.res .n{font-weight:600;line-height:1.25}
.res .k{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .s{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.grp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
.list>.res:first-child,.list>.navrow:first-child{border-top:0}
.navrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-weight:600}
.navrow .ni{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--ember)}
.nut{display:grid;grid-template-columns:1fr auto;row-gap:8px;font-size:14px}
.nut b{font-variant-numeric:tabular-nums}
.nut .sub{padding-left:14px;color:var(--muted)}
.bigk{font-size:44px;line-height:1}
.mic{width:64px;height:64px;border-radius:50%;background:var(--ember);color:#fff;display:grid;place-items:center;border-bottom:4px solid #A93710;flex:none}
.mic svg{width:28px;height:28px}
.mic.on{animation:micp 1.2s infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(228,81,27,.5)}100%{box-shadow:0 0 0 18px rgba(228,81,27,0)}}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ember);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.busy{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 0;color:var(--muted);font-weight:600;text-align:center}
.rev{display:grid;grid-template-columns:1fr 84px 30px;gap:4px 8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rev:first-child{border-top:0}
.rev .inp{height:40px;text-align:right;padding:0 8px}

/* Rewards */
.lvl{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.lvl .badge{width:64px;height:64px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;border-bottom:4px solid var(--primary-edge)}
.streak-big{display:flex;align-items:center;gap:12px}
.streak-big .fl{width:56px;height:56px;color:var(--ember)} .streak-big .fl.off{color:var(--line)}
.streak-big .num{font-size:48px;line-height:1}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 12px}
.ladder i{height:6px;border-radius:3px;background:var(--surface-2)} .ladder i.on{background:var(--ember)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ac{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:700;line-height:1.2}
.ac .md{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:2px solid var(--line)}
.ac.on .md{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.ac span{font-weight:500;color:var(--muted);font-size:11px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted);font-weight:600}
.stat4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.stat .num{font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.cal i.on{background:var(--ember);color:#fff} .cal i.z{background:var(--ice-soft);color:var(--ice)} .cal i.zone{background:var(--good);color:#fff} .cal i.t{outline:2px solid var(--ink);outline-offset:1px} .cal i.x{visibility:hidden}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.split i{display:block;height:100%}

/* Toast + celebrate */
.toasts{position:absolute;left:0;right:0;bottom:104px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:9px 14px;border-radius:99px;display:flex;gap:6px;align-items:center;animation:tin .25s cubic-bezier(.2,.8,.2,1);max-width:90%}
.toast.xp{background:var(--gold);color:#1b1503} .toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{transform:translateY(14px);opacity:0}}
.cele{position:absolute;inset:0;z-index:50;background:rgba(8,16,13,.6);display:grid;place-items:center;padding:24px;animation:fade .2s}

/* v2: weight, activity, coach, boss */

.boss{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}

.thumbs{display:flex;gap:8px;flex-wrap:wrap} .thumbs img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.idea{display:flex;flex-direction:column;gap:8px}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden} .prog i{display:block;height:100%;background:var(--ember);transition:width .2s}
a.link{text-decoration:none}

/* v3: training */
.chip.you{padding:0;width:34px;justify-content:center}
.wkn{font-family:var(--display);font-weight:700;font-size:17px;text-align:left;letter-spacing:-.01em}
.sets{display:flex;flex-direction:column;gap:6px;margin:10px 0 8px}

.tick{width:44px;height:42px;border-radius:12px;border:1.5px solid var(--line);border-bottom-width:4px;display:grid;place-items:center;color:var(--line);flex:none;background:var(--surface)}

.tick:active{transform:translateY(2px);border-bottom-width:2px}
input[type=range]{width:100%;accent-color:var(--ember);height:28px}

/* v3: coach and community */

@media (max-width:379px){.brand .bn{display:none}}

.ccard{display:block;width:100%;text-align:left}

.ccard .between{display:flex}

.wdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}

button.pill.cafp{background:var(--surface-2);color:var(--ink);padding:7px 11px;font-size:13px;border:1px solid var(--line)}

/* ---- Today, second pass: one loud budget panel, then quiet rows ---- */
.hero2{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:0}

.h-kv{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:13px;align-items:baseline;padding-bottom:2px}
.h-kv span{color:var(--hero-mute);font-weight:600} .h-kv b{text-align:right;font-weight:700}
.gauge{position:relative;height:16px;border-radius:99px;background:var(--hero-line);margin-top:18px}
.gauge i{position:absolute;top:0;bottom:0;display:block}
.gauge .gz{background:rgba(127,227,180,.26);border-left:2px solid var(--hero-good);border-right:2px solid var(--hero-good)}
.gauge .gf{left:0;border-radius:99px;background:var(--hero-fill);min-width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hero2.in .gf{background:var(--hero-good)} .hero2.over .gf{background:var(--hero-bad)}
.gauge .gt{width:2px;top:-4px;bottom:-4px;background:var(--hero-ink);margin-left:-1px;border-radius:2px}
.g-lab{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--hero-mute);margin-top:9px}
.hero2.in .g-lab span:first-child{color:var(--hero-good)} .hero2.over .g-lab span:first-child{color:var(--hero-bad)}
.h-mac{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hero-line)}
.hm-l{font-size:12px;font-weight:700;margin-bottom:6px}
.hm-v{font-size:12px;color:var(--hero-mute);margin-top:6px;font-weight:600} .hm-v b{color:var(--hero-ink);font-size:15px}
.bar.hb{height:6px;background:var(--hero-line)} .bar.hb.p i{background:#7FE3B4} .bar.hb.c i{background:#F2C866} .bar.hb.f i{background:#A9C4EE}
@media (max-width:360px){.h-n{font-size:50px}}

.next{display:flex;gap:12px;align-items:flex-start;background:var(--ember-soft);border-radius:var(--r);padding:14px 16px}
.next .nx-i{width:36px;height:36px;border-radius:12px;background:var(--surface);color:var(--ember);display:grid;place-items:center;flex:none}
.next h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.next p{font-size:13px;color:var(--muted);margin-top:3px}

.rail-w{display:flex;flex-direction:column;gap:8px;min-width:0}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.chipf{display:flex;align-items:center;gap:9px;flex:none;max-width:210px;padding:9px 13px 9px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-bottom:3px solid var(--line);text-align:left;scroll-snap-align:start}

.chipf span{min-width:0;display:block} .chipf b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipf small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipf:active{transform:translateY(2px);border-bottom-width:1px;margin-bottom:2px} .chipf[disabled]{opacity:.5}

.card.meals{padding:4px 16px}
.ml{padding:8px 0} .ml+.ml{border-top:1px solid var(--line)}
.ml-h{display:flex;align-items:center;gap:4px}
.ml-t{flex:1;min-width:0;text-align:left;padding:2px 0}
.ml-t h2{font-size:17px} .ml-t small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.ml-k{font-weight:700;font-size:15px;margin-right:2px} .ml-k small{font-size:11px;color:var(--muted);font-weight:600}
.ml-add{width:38px;height:38px;border-radius:12px;background:var(--ember-soft);color:var(--ember);display:grid;place-items:center;flex:none}
.ml-add svg{stroke-width:2.6} .ml-add:active{transform:scale(.94)}
.ml .entry:first-of-type{margin-top:8px}

.trks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;min-width:0}
.trk-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);text-align:left}
.trk-h svg{width:16px;height:16px}
.trk-v{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 8px;white-space:nowrap} .trk-v .num{font-size:26px;color:var(--ink);line-height:1;letter-spacing:-.02em}
.trk .bar{height:6px}
.trk-s{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.3;min-height:31px}
.trk-a{display:flex;gap:6px;margin-top:8px}
.tkb{height:36px;min-width:36px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;white-space:nowrap}
.tkb.w{flex:1} .tkb svg{width:16px;height:16px;stroke-width:2.4} .tkb:active{transform:translateY(1px);background:var(--line)}

.qs{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.qs-p{display:flex;gap:-4px} .qs-p i{width:30px;height:30px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-style:normal;margin-right:-6px;border:2px solid var(--surface)}
.qs-p i:last-child{margin-right:0} .qs-p i.on{background:var(--good-soft);color:var(--good)} .qs-p svg{width:15px;height:15px}
.qs b{display:block;font-size:14px} .qs small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.3}

/* ---- Add, second pass ---- */
.say{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px 12px 12px;border-radius:16px;background:var(--primary);color:var(--on-primary);border-bottom:4px solid var(--primary-edge)}

.say .say-i{width:42px;height:42px;border-radius:13px;background:var(--ember);color:#fff;display:grid;place-items:center;flex:none}

.say.slim{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:4px solid var(--line);padding:10px 12px;margin-bottom:4px}

.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tiles.t3 .tile{flex-direction:row;justify-content:center;gap:8px;padding:12px 6px;font-size:13px}

.also{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.also button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:0;height:34px;padding:0 4px;border-radius:99px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}

.frow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.list>.frow:first-child{border-top:0}
.frow .res{border-top:0;flex:1;min-width:0}
.res .k small{font-size:11px;color:var(--muted);font-weight:600}
.res .s .ell{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qadd{width:40px;height:40px;border-radius:13px;background:var(--ember-soft);color:var(--ember);display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.qadd svg{stroke-width:2.6} .qadd:active{transform:scale(.92)} .qadd.ok{background:var(--good);color:#fff}
.yrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px}
.yrow b{display:block;font-size:14px} .yrow .grow small{display:block;font-size:12px;color:var(--muted)}
.yrow>span{font-weight:700;font-size:14px;white-space:nowrap} .yrow>span small{font-size:11px;color:var(--muted);font-weight:600}
#addList{display:flex;flex-direction:column;gap:10px}

#addFoot{align-items:center}
.toast button{pointer-events:auto;color:var(--ember);font-weight:800;font-size:14px;margin-left:6px;padding:2px 4px}
.toasts .toast{pointer-events:none} .toasts .toast button{pointer-events:auto}
@media (max-width:360px){.rail-h .muted{display:none}}
.g-lab span:last-child{white-space:nowrap}

/* ---- drinks ---- */
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.opts button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
label.dim{opacity:.4;pointer-events:none}
.qadd.alt{background:var(--surface-2);color:var(--muted)} .qadd.alt svg{stroke-width:2;width:18px;height:18px}

.chk .tb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.chk .tb svg{width:15px;height:15px;stroke-width:3} .chk[aria-pressed="true"] .tb{background:var(--good);border-color:var(--good)}

/* ---- Train, second pass ---- */
.tweek-w{display:flex;flex-direction:column;gap:8px}
.tw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.tw .node{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted)}

.tw.cond .node{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--gold)}
.tw.rehab .node{background:var(--ice-soft);border-color:var(--ice-soft);color:var(--ice)}

.tw.now{color:var(--ink)} .tw.now .node{outline:2px solid var(--ember);outline-offset:2px}
.tw.future{opacity:.5}
.thero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.th-k{font-size:12.5px;font-weight:700;color:var(--hero-mute)}
.th-t{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.02;margin-top:4px;text-wrap:balance}
.th-f{font-size:14px;color:var(--hero-mute);margin-top:6px;line-height:1.35}
.th-done{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--hero-good);margin-bottom:10px}

.th-meta{display:flex;gap:6px;flex-wrap:wrap} .th-meta span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--hero-line)}
.th-list{border-top:1px solid var(--hero-line)}
.th-x{display:grid;grid-template-columns:1fr auto 92px;gap:10px;padding:9px 0;border-bottom:1px solid var(--hero-line);font-size:14px;align-items:baseline}
.th-x span:first-child{font-weight:600} .th-x span:nth-child(2){color:var(--hero-mute);font-size:13px} .th-x b{text-align:right;font-weight:700;white-space:nowrap}
.th-x b.up{color:var(--hero-good)} .th-x b i{font-style:normal;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:rgba(127,227,180,.2);vertical-align:1px}
.th-more{font-size:12px;color:var(--hero-mute);padding-top:8px}
.th-links{display:flex;gap:18px;flex-wrap:wrap;margin-top:-2px}
.th-links button{color:var(--hero-ink);font-weight:700;font-size:13px;text-decoration:underline;text-decoration-color:var(--hero-mute);text-underline-offset:3px}
.th-rd{display:flex;align-items:center;gap:12px;text-align:left;border-top:1px solid var(--hero-line);padding-top:14px;width:100%;color:inherit}

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pdate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey(new Date());
const r0 = x => Math.round(x || 0);
const r1 = x => Math.round((x || 0) * 10) / 10;
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const fmt = n => r0(n).toLocaleString('en-IE');
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const withTimeout = (p, ms = 12000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const weekStart = k => { const d = pdate(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dkey(d); };
const niceDate = k => { const t = today(); if (k === t) return 'Today'; if (k === addDays(t, -1)) return 'Yesterday'; if (k === addDays(t, 1)) return 'Tomorrow'; const d = pdate(k); return WD[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); };
const MEALS = { b: 'Breakfast', l: 'Lunch', d: 'Dinner', s: 'Snacks' };
const mealNow = () => { const h = new Date().getHours(); return h < 11 ? 'b' : h < 15 ? 'l' : h < 17 ? 's' : h < 22 ? 'd' : 's'; };

/* ---------- storage: cloud (db capability) with a device-only fallback ---------- */
const MEM = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return MEM[k] ?? null; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) { } },
  keys(prefix) { const out = new Set(Object.keys(MEM).filter(k => k.startsWith(prefix))); try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) out.add(k); } } catch (e) { } return [...out]; }
};
const Store = {
  mode: 'boot', db: null, base: null, q: {}, busy: 0, failed: false,
  async init() {
    let db = null, id = null;
    try {
      if (window.claude && window.claude.use) {
        const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (d && u) { id = await u.id(); if (id) db = d; try { this.owner = !!(await u.isOwner()); } catch (e) { this.owner = true; } }
      }
    } catch (e) { }
    if (db) { this.mode = 'cloud'; this.db = db; this.uid = id; this.base = db.doc('data/users/' + id + '/profile'); }
    else { this.mode = 'local'; this.owner = true; }
    setSync();
  },
  ref(kind, id) { return kind === 'profile' ? this.base : this.base.collection(kind).doc(id); },
  key(kind, id) { return 'ember:' + kind + (id ? ':' + id : ''); },
  async get(kind, id) {
    if (this.mode === 'cloud') { const s = await withTimeout(this.ref(kind, id).get()); return s.exists ? clone(s.data()) : null; }
    return LS.get(this.key(kind, id));
  },
  async list(kind) {
    if (this.mode === 'cloud') { const qs = await withTimeout(this.base.collection(kind).limit(500).get()); return qs.docs.map(d => ({ ...clone(d.data()), id: d.id })); }
    return LS.keys(this.key(kind) + ':').map(k => LS.get(k)).filter(Boolean);
  },
  put(kind, id, data) { if (DEMO) return; this.enqueue(kind, id, { data: clone(data) }); },
  del(kind, id) { if (DEMO) return; this.enqueue(kind, id, { del: true }); },
  enqueue(kind, id, job) {
    if (this.mode !== 'cloud') { job.del ? LS.del(this.key(kind, id)) : LS.set(this.key(kind, id), job.data); return; }
    const k = kind + '/' + (id || '');
    const q = this.q[k] || (this.q[k] = { run: false, next: null });
    q.next = job;
    if (!q.run) this.pump(q, kind, id);
  },
  async pump(q, kind, id) {
    q.run = true; this.busy++; setSync();
    while (q.next) {
      const job = q.next; q.next = null;
      try {
        const ref = this.ref(kind, id);
        await (job.del ? ref.delete() : ref.set(job.data));
        this.failed = false;
      } catch (e) {
        if (e && e.code === 'unavailable' && !job.retried) { job.retried = true; await sleep(700 + Math.random() * 900); if (!q.next) q.next = job; }
        else { this.failed = true; console.warn('save failed', kind, id, e); toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete old data to keep saving.' : 'Could not save. Check your connection.'); }
      }
    }
    q.run = false; this.busy--; setSync();
  }
};
function setSync() {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + (Store.mode !== 'cloud' ? 'local' : Store.failed ? 'err' : Store.busy ? 'saving' : '');
  el.title = Store.mode !== 'cloud' ? 'Saved on this device only' : Store.failed ? 'Last save failed' : Store.busy ? 'Saving' : 'Saved to your account';
}

/* ---------- state ---------- */
const S = { tab: 'today', date: today(), ready: false, days: {}, recipes: {}, foods: {}, range: 7 };
let P = null; // profile
const defaultProfile = () => ({
  v: 1, onboarded: false, sex: 'm', age: 30, cm: 178, kg: 80, act: 1.375, goal: 'lose', rate: 0.5,
  t: { k: 2000, p: 140, c: 215, f: 65, w: 2500 }, exAdd: true,
  xp: 0, gems: 0, fr: 1, best: 0, ach: {}, lg: { tier: 0, wk: weekStart(today()), xp: 0 },
  st: { logs: 0, say: 0, photo: 0, scan: 0, zone: 0, prot: 0, water: 0, closed: 0, weigh: 0, quests: 0, work: 0, boss: 0, sess: 0, prs: 0, rehab: 0, mob: 0, ready: 0 },
  hist: {}, wts: [], rec: [], created: today(),
  goalKg: 0, startKg: 0, startD: '', ms: {}, boss: null, coach: null, xlog: [], ad: null,
  prog: null, tasks: [{ id: 'ready', auto: 'ready' }, { id: 'move', auto: 'move' }, { id: 'mob', auto: 'mob' }, { id: 'protein', auto: 'protein' }], mode: 'me', asgV: 0, coachName: '', bed: '23:00'
});
const newDay = date => ({ date, e: [], w: 0, x: [], q: {}, chest: 0, done: 0, zone: 0, xp: 0, lx: 0, wx: 0, cf: [] });
const xmin = d => d.x.reduce((s, x) => s + (x.min || 0), 0);
function fixProfile(p) {
  const d = defaultProfile();
  for (const k in d) if (p[k] === undefined) p[k] = d[k];
  p.t = { ...d.t, ...p.t }; p.st = { ...d.st, ...p.st }; p.lg = { ...d.lg, ...p.lg };
  return p;
}
async function loadDay(date) {
  if (S.days[date]) return S.days[date];
  let d = null;
  try { d = await Store.get('days', date); } catch (e) { toast('Could not load that day. Check your connection.'); throw e; }
  d = d ? { ...newDay(date), ...d } : newDay(date);
  S.days[date] = d; return d;
}
const day = () => S.days[S.date] || newDay(S.date);
function totals(d) {
  const t = { k: 0, p: 0, c: 0, f: 0, fi: 0, su: 0, sf: 0, na: 0, n: d.e.length, ex: 0 };
  for (const e of d.e) { t.k += e.k || 0; t.p += e.p || 0; t.c += e.c || 0; t.f += e.f || 0; t.fi += e.fi || 0; t.su += e.su || 0; t.sf += e.sf || 0; t.na += e.na || 0; }
  for (const x of d.x) t.ex += x.k || 0;
  return t;
}
const budget = d => P.t.k + (P.exAdd ? totals(d).ex : 0);
function zone(d) {
  const b = budget(d); const [lo, hi] = P.goal === 'gain' ? [.95, 1.1] : P.goal === 'keep' ? [.92, 1.08] : [.9, 1.05];
  return { lo: r0(b * lo), hi: r0(b * hi), b };
}
const inZone = d => { const z = zone(d), k = totals(d).k; return k >= z.lo && k <= z.hi; };

/* ---------- targets ---------- */
function calcTargets(p) {
  const bmr = 10 * p.kg + 6.25 * p.cm - 5 * p.age + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * p.act;
  const adj = p.goal === 'lose' ? -p.rate * 1100 : p.goal === 'gain' ? p.rate * 1100 : 0; // 7700 kcal per kg, spread over 7 days
  const floor = p.sex === 'f' ? 1200 : 1500;
  const k = Math.max(floor, Math.round((tdee + adj) / 10) * 10);
  const prot = Math.round(p.kg * (p.goal === 'lose' ? 1.8 : 1.6) / 5) * 5;
  const fat = Math.round(k * 0.27 / 9 / 5) * 5;
  const carb = Math.max(50, Math.round((k - prot * 4 - fat * 9) / 4 / 5) * 5);
  const w = clamp(Math.round(p.kg * 35 / 250) * 250, 2000, 3500);
  return { k, p: prot, c: carb, f: fat, w, tdee: r0(tdee), floored: tdee + adj < floor };
}

/* ---------- game rules ---------- */
const LEAGUES = ['Spark', 'Kindle', 'Flame', 'Blaze', 'Forge', 'Furnace', 'Solar'];
const PROMO = 700, STAY = 250;
const levelOf = xp => { let l = 1; while (50 * l * (l + 1) <= xp) l++; return l; };
const levelFloor = l => 50 * l * (l - 1);
const hasDay = k => { const h = P.hist[k]; return !!h && (h.n > 0 || !!h.z); };
function streak() {
  const t = today(); let d = t, count = 0; const todayDone = !!(P.hist[t] && P.hist[t].n > 0);
  if (!hasDay(t)) d = addDays(t, -1);
  while (hasDay(d)) { count++; d = addDays(d, -1); }
  return { count, todayDone, atRisk: !todayDone && count > 0 };
}
function applyFreezes() {
  const t = today(); const gap = []; let d = addDays(t, -1);

A.sayGo = async () => {
  const text = ($('#sayText').value || '').trim(); if (text.length < 2) return toast('Say or type what you ate first.');

  const body = $('#sayBody'); const keep = body.innerHTML; const foot = topSheet().querySelector('.sheet-f'); foot.classList.add('hide');

  if (h.rd >= 34) return 'Train as planned and skip the extras. Aim for a strain of 10 to 14.' + at;

    ${own && !DEMO ? grp('For professionals', [row('modeGo', 'users', 'Coach view', 'Clients, programs and messages', 'data-m="coach"'), row('modeGo', 'home', 'Gym view', 'Timetable, bookings and members', 'data-m="gym"')]) : ''}
    <section class="card"><h2>How Ember keeps numbers honest</h2><div class="stack small" style="margin-top:10px">
      <div class="row" style="align-items:flex-start">${srcBadge('F')}<span>Everyday foods come from USDA FoodData Central, measured in a lab or a national survey.</span></div>
      <div class="row" style="align-items:flex-start">${srcBadge('B')}<span>Branded products use the printed label, from Open Food Facts.</span></div>
      <div class="row" style="align-items:flex-start">${srcBadge('AI')}<span>Anything Claude had to estimate is marked, so you know which numbers are measured and which are a best guess.</span></div></div></section>`;
}
