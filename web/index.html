  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-flame" viewBox="0 0 24 24">
          <path
            d="M12.6 2.2c.5 3.3 4.9 5.4 4.9 10.6a5.5 5.5 0 0 1-11 0c0-2.2.9-3.9 2.2-5.2.1 1.8.8 2.9 1.8 3.3.1-3.4.7-6.3 2.1-8.7z"
          />
        </symbol>
        <symbol id="i-gem" viewBox="0 0 24 24">
          <path d="M6 3h12l4 6-10 12L2 9zM2 9h20M12 21 8 9l2-6M12 21l4-12-2-6" />
        </symbol>
        <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </symbol>
        <symbol id="i-mic" viewBox="0 0 24 24">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v4" />
        </symbol>
        <symbol id="i-camera" viewBox="0 0 24 24">
          <path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" />
          <circle cx="12" cy="13" r="3.5" />
        </symbol>
        <symbol id="i-barcode" viewBox="0 0 24 24">
          <path d="M4 5v14M7.5 5v14M11 5v14M14 5v14M17.5 5v14M20 5v14" />
        </symbol>
        <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
        <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
        <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z" /></symbol>
        <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12" /></symbol>
        <symbol id="i-trophy" viewBox="0 0 24 24">
          <path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 20h8" />
        </symbol>
        <symbol id="i-target" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="i-snow" viewBox="0 0 24 24">
          <path d="M12 2v20M3.3 7l17.400 10M20.700 7 3.300 17M9 4l3 3 3-3M9 20l3-3 3 3" />
        </symbol>
        <symbol id="i-chest" viewBox="0 0 24 24">
          <rect x="3" y="9" width="18" height="11" rx="2" />
          <path d="M3 13h18M10 13v3h4v-3M5 9a7 5 0 0 1 14 0" />
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></symbol>
        <symbol id="i-scale" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path d="M8 9a6 6 0 0 1 8 0l-3 3h-2z" />
        </symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M10.500 20V5M16 20v-6M21 20H3" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.500 12 4l8 7.500V20h-5v-5H9v5H4z" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.300" />
          <circle cx="12" cy="12" r="1.300" />
          <circle cx="19" cy="12" r="1.300" />
        </symbol>
        <symbol id="i-cal" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M3 10h18M8 3v4M16 3v4" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></symbol>
        <symbol id="i-cup" viewBox="0 0 24 24">
          <path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h2a2.500 2.500 0 0 1 0 5h-2M7 3v2M11 3v2" />
        </symbol>
        <symbol id="i-undo" viewBox="0 0 24 24">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="12" rx="2" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path
            d="M12 3l2.700 5.600 6.100.800-4.500 4.300 1.100 6.100L12 17l-5.400 2.800 1.100-6.100L3.200 9.400l6.100-.800z"
          />
        </symbol>
        <symbol id="i-spark" viewBox="0 0 24 24">
          <path
            d="M11 3l1.800 5.200L18 10l-5.200 1.800L11 17l-1.800-5.200L4 10l5.200-1.800zM18.500 15l.800 2.200 2.200.800-2.200.800-.800 2.200-.800-2.200-2.200-.800 2.200-.800z"
          />
        </symbol>
        <symbol id="i-fork" viewBox="0 0 24 24">
          <path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 21V3c-2 2-3 4.500-3 8h3" />
        </symbol>
        <symbol id="i-label" viewBox="0 0 24 24">
          <path
            d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h8M8 12h8M8 15h5"
          />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </symbol>
        <symbol id="i-db" viewBox="0 0 24 24">
          <ellipse cx="12" cy="6" rx="8" ry="3" />
          <path d="M4 6v6c0 1.700 3.600 3 8 3s8-1.300 8-3V6M4 12v6c0 1.700 3.600 3 8 3s8-1.300 8-3v-6" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path
            d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"
          />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z" /></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5" /></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" /></symbol>
        <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6" /></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.500v15l12-7.500z" /></symbol>
        <symbol id="i-timer" viewBox="0 0 24 24">
          <circle cx="12" cy="13" r="8" />
          <path d="M12 9v4l2.500 2M9 2h6" />
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3.500" />
          <path
            d="M2.500 20a6.500 6.500 0 0 1 13 0M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.500a6.500 6.500 0 0 1 3.500 5.500"
          />
        </symbol>
        <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.500 20h19zM12 10v5M12 17.500v.500" /></symbol>
        <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7" /></symbol>
      </defs>
    </svg>
    <div id="app">
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 4.2a7.8 7.8 0 1 0 7.8 7.8"
              fill="none"
              stroke="currentColor"
              stroke-width="3.4"
              stroke-linecap="round"
            />
            <circle class="dot" cx="18.1" cy="5.9" r="2.5" /></svg
          ><span class="bn">Ember</span>
        </div>
        <span class="pill gold hide" id="brandTag">Coach</span>
        <span class="sync local" id="sync" title="Storage status"></span>
        <span class="sp"></span>
        <button class="chip mode hide" id="chipMode" data-act="modeToggle" aria-label="Switch to coach view"></button>
        <button class="chip flame off" id="chipStreak" data-act="tab" data-tab="quests" aria-label="Streak">
          <svg class="ic fill"><use href="#i-flame" /></svg><span class="tn">0</span>
        </button>
        <button class="chip gem" id="chipGems" data-act="tab" data-tab="quests" aria-label="Gems">
          <svg class="ic"><use href="#i-gem" /></svg><span class="tn">0</span>
        </button>
        <button class="chip you" id="chipCal" data-act="cal" aria-label="Calendar and plan">
          <svg class="ic"><use href="#i-cal" /></svg>
        </button>
        <button class="chip you" id="chipYou" data-act="tab" data-tab="you" aria-label="You, settings and connections">
          <svg class="ic"><use href="#i-user" /></svg>
        </button>
      </header>
      <main id="main">
        <div class="boot">
          <div class="busy">
            <div class="spinner"></div>
            Opening your diary
          </div>
        </div>
      </main>
      <button class="asfab hide" id="asFab" data-act="voice" aria-label="Talk to the assistant">
        <svg class="ic"><use href="#i-mic" /></svg>
      </button>
      <nav class="tabs" aria-label="Sections">
        <button class="tab" data-act="tab" data-tab="today">
          <svg class="ic"><use href="#i-home" /></svg>Today
        </button>
        <button class="tab" data-act="tab" data-tab="train">
          <svg class="ic"><use href="#i-dumbbell" /></svg>Train
        </button>
        <button class="fab" data-act="add" aria-label="Log food">
          <svg class="ic"><use href="#i-plus" /></svg>
        </button>
        <button class="tab" data-act="tab" data-tab="progress">
          <svg class="ic"><use href="#i-chart" /></svg>Progress
        </button>
        <button class="tab" data-act="tab" data-tab="quests">
          <svg class="ic"><use href="#i-trophy" /></svg>Quests
        </button>
      </nav>
      <div id="sheets"></div>
      <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
      <div id="cele"></div>
      <canvas id="confetti" class="hide"></canvas>
      <input type="file" id="filePhoto" accept="image/*" multiple class="hide" />
      <input type="file" id="fileMenu" accept="image/*" class="hide" />
      <input type="file" id="fileDiary" accept=".csv,.zip,text/csv,application/zip" multiple class="hide" />
      <input type="file" id="fileCsv" accept=".csv,text/csv,text/plain" class="hide" />
      <input type="file" id="fileHealth" accept=".zip,.xml,application/zip,text/xml" class="hide" />
      <input type="file" id="fileLabel" accept="image/*" class="hide" />
      <input type="file" id="fileProg" accept="image/*" class="hide" />
      <input type="file" id="fileCode" accept="image/*" class="hide" />
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
