name: Android test build
# Builds the Android app from the web build and attaches it to the run as "ember-android-debug".
# This is a debug build for trying on a phone: download it from the run's page, open it on an Android
# phone and allow the install. It is not signed for the Play Store.
on:
  workflow_dispatch:
  push:
    branches: [claude/sharp-babbage-2x2bk6, main]
    paths: ['web/android/**', 'web/capacitor.config.ts', 'web/assets/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app and copy it into the Android project
        working-directory: web
        run: |
          npm ci
          npx vite build
          npx cap sync android
      - name: Build the Android app
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ember-android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
