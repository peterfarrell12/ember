name: CI
on:
  push:
  pull_request:
jobs:
  prototype-tests:
    name: Build and core browser tests (prototype and web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: pip install playwright pillow
      # The tests drive Google Chrome (channel="chrome"), which the ubuntu-latest image already has.
      - name: Build the prototype and run the core tests
        run: prototype/run-tests.sh --jobs 2
      - name: Build the web app and run the same tests against it
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --jobs 2
      - name: Keep the test output when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: prototype/test/out/
