name: CI
on:
  push:
  pull_request:
jobs:
  prototype-tests:
    name: Build and core browser tests (prototype and web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: pip install playwright pillow
      # The tests drive Google Chrome (channel="chrome"), which the ubuntu-latest image already has.
      - name: Build the prototype and run the core tests
        run: prototype/run-tests.sh --jobs 2
      - name: Build the web app and run the same tests against it
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test -- --jobs 2
          npm install --no-save playwright
          npm run test:scanner
          npm run test:voice
          npm run test:onboarding
      - name: Keep the test output when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: prototype/test/out/

  database-policies:
    name: Database policies (second account gets nothing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a local Supabase with the migrations applied
        working-directory: supabase
        run: |
          npm ci
          npm run start
      - name: Policy test
        working-directory: supabase
        run: npm test
      - name: Server function tests (stand-in for Anthropic, no cost)
        working-directory: supabase
        run: npm run test:unit
      - name: Accounts and sync in a real browser (sign in, move a diary, second browser, sign out)
        run: |
          (cd web && npm ci)
          cd supabase
          npm install --no-save playwright
          npm run test:e2e
      - name: Squads in a real browser (start one, join from the invite, the board, a challenge, leaving)
        run: |
          (cd web && npm ci)
          cd supabase
          npm install --no-save playwright
          npm run test:squads
          npm run test:coach
